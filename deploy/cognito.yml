AWSTemplateFormatVersion: "2010-09-09"
Description: "Brujula, usuarios: User Pool de Cognito (solo cuentas creadas por el administrador), cliente con flujo de codigo y dominio alojado."

Parameters:
  CallbackUrl:
    Type: String
    Description: URL de retorno del servidor, p. ej. https://xxxx.lambda-url.us-east-1.on.aws/callback
  LogoutUrl:
    Type: String
    Description: p. ej. https://xxxx.lambda-url.us-east-1.on.aws/login
  DomainPrefix:
    Type: String
    Default: brujula-jfb
    Description: Prefijo del dominio alojado de Cognito (único en la región).
  FrontBaseUrl:
    Type: String
    Default: ""
    Description: Base del front Angular sin barra final, p. ej. https://xxxx.lambda-url.us-east-1.on.aws/app (vacío si no hay front).

Conditions:
  HayFront: !Not [!Equals [!Ref FrontBaseUrl, ""]]

Resources:
  Pool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: brujula
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireLowercase: true, RequireNumbers: true, RequireUppercase: true, RequireSymbols: false}
      Schema:
        - {Name: email, Required: true, Mutable: true}
        - {Name: empresa_id, AttributeDataType: String, Mutable: true, StringAttributeConstraints: {MinLength: "1", MaxLength: "16"}}
        - {Name: rol, AttributeDataType: String, Mutable: true, StringAttributeConstraints: {MinLength: "1", MaxLength: "16"}}
  Cliente:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: brujula-web
      UserPoolId: !Ref Pool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      # USER_PASSWORD_AUTH: el formulario propio del front habla directo con Cognito por HTTPS (la clave nunca pasa por el servidor).
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      # La empresa y el rol los fija el servidor con APIs de administrador: un usuario no puede cambiárselos a sí mismo.
      ReadAttributes: [email, email_verified, "custom:empresa_id", "custom:rol"]
      WriteAttributes: [email]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If [HayFront, [!Ref CallbackUrl, !Sub "${FrontBaseUrl}/callback"], [!Ref CallbackUrl]]
      LogoutURLs: !If [HayFront, [!Ref LogoutUrl, !Sub "${FrontBaseUrl}/login"], [!Ref LogoutUrl]]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 12
      IdTokenValidity: 12
      TokenValidityUnits: {AccessToken: hours, IdToken: hours}
  Dominio:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref Pool

Outputs:
  UserPoolId:
    Value: !Ref Pool
  ClientId:
    Value: !Ref Cliente
  Domain:
    Value: !Sub "${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  CrearUsuario:
    Value: !Sub "aws cognito-idp admin-create-user --user-pool-id ${Pool} --username correo@dominio --user-attributes Name=email,Value=correo@dominio Name=email_verified,Value=true"
