AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Brujula (Hackathon 30X, reto Dapta): Lambda con imagen de contenedor y Function URL (HTTPS), PostgreSQL en RDS,
  secretos en Secrets Manager, S3 para archivos con URL prefirmadas y EventBridge que dispara el siguiente lote cada hora
  dentro de la ventana legal y la sincronizacion con Dapta.

Parameters:
  ImageUri:
    Type: String
    Description: URI de la imagen en ECR (cuenta.dkr.ecr.region.amazonaws.com/brujula:tag)
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 12
  DaptaApiKey:
    Type: String
    NoEcho: true
    Default: ""
  DaptaAgentId:
    Type: String
    Default: ""
  DaptaSequenceId:
    Type: String
    Default: ""
  OpenRouterApiKey:
    Type: String
    NoEcho: true
    Default: ""
  ResendApiKey:
    Type: String
    NoEcho: true
    Default: ""
  EmailProvider:
    Type: String
    Default: ses
    AllowedValues: [ses, resend]
  EmailFrom:
    Type: String
    Default: "Brujula <hola@example.com>"
  CronKey:
    Type: String
    NoEcho: true
    MinLength: 16
  CorsOrigins:
    Type: String
    Default: "*"
  DenueToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Token gratuito del DENUE (INEGI, México) para el conector denue.
  ModoPrueba:
    Type: String
    Default: "1"
    Description: "1 = desvío: las llamadas van a TelefonoPrueba y los correos a CorreosPrueba, nunca al lead; 0 = contacto real a los leads."
  TelefonoPrueba:
    Type: String
    Default: ""
    Description: Número E.164 al que se desvían todas las llamadas en modo prueba (una por lote).
  CorreosPrueba:
    Type: String
    Default: ""
    Description: Correos verificados en SES, separados por coma, a los que se desvían los correos en modo prueba.
  CronLotes:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Estado de las reglas de EventBridge que lanzan el lote cada hora.
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoClientId:
    Type: String
    Default: ""
  CognitoDomain:
    Type: String
    Default: ""
    Description: p. ej. brujula-jfb.auth.us-east-1.amazoncognito.com (salida de deploy/cognito.yml). Vacio = servidor abierto.
  SessionSecret:
    Type: String
    NoEcho: true
    Default: ""
  PublicBaseUrl:
    Type: String
    Default: ""
    Description: URL publica del servicio (salida Url de esta misma pila, sin barra final). Vacio en el primer despliegue.

Resources:
  # --- Base de datos ---
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Brujula RDS (acceso publico con contrasena fuerte y SSL; decision de hackathon, no de produccion)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: brujula
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      DBName: brujula
      MasterUsername: brujula
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: true
      VPCSecurityGroups: [!GetAtt DbSecurityGroup.GroupId]
      BackupRetentionPeriod: 1
      StorageEncrypted: true

  # --- Secretos (la aplicacion los lee al arrancar con SECRET_ARN) ---
  Secreto:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: brujula/env
      SecretString: !Sub |
        {"DAPTA_API_KEY":"${DaptaApiKey}","DAPTA_AGENT_ID":"${DaptaAgentId}","DAPTA_SEQUENCE_ID":"${DaptaSequenceId}",
         "OPENROUTER_API_KEY":"${OpenRouterApiKey}","RESEND_API_KEY":"${ResendApiKey}","CRON_KEY":"${CronKey}","SESSION_SECRET":"${SessionSecret}","DENUE_TOKEN":"${DenueToken}",
         "DATABASE_URL":"postgresql+psycopg://brujula:${DbPassword}@${Db.Endpoint.Address}:5432/brujula?sslmode=require"}

  # --- Archivos: bucket privado con URL prefirmadas ---
  Exportaciones:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "brujula-exportaciones-${AWS::AccountId}"
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: subidas-30-dias
            Status: Enabled
            Prefix: subidas/
            ExpirationInDays: 30

  # --- La aplicacion: Lambda con imagen de contenedor y Function URL ---
  FuncionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: brujula-secretos-archivos-correo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [secretsmanager:GetSecretValue], Resource: !Ref Secreto}
              - {Effect: Allow, Action: [ses:SendEmail, ses:SendRawEmail], Resource: "*"}
              - {Effect: Allow, Action: [s3:PutObject, s3:GetObject, s3:ListBucket], Resource: [!GetAtt Exportaciones.Arn, !Sub "${Exportaciones.Arn}/*"]}
              - {Effect: Allow, Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream], Resource: "*"}
              - {Effect: Allow, Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser, cognito-idp:AdminUpdateUserAttributes], Resource: "*"}
  Funcion:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: brujula
      Description: Brujula, API, tablero y webhooks (FastAPI con Lambda Web Adapter)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt FuncionRole.Arn
      Architectures: [x86_64]
      MemorySize: 1536
      Timeout: 300
      Environment:
        Variables:
          TZ: America/Bogota
          PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /healthz
          SECRET_ARN: !Ref Secreto
          EMAIL_PROVIDER: !Ref EmailProvider
          EMAIL_FROM: !Ref EmailFrom
          EXPORT_BUCKET: !Ref Exportaciones
          CORS_ORIGINS: !Ref CorsOrigins
          MODO_PRUEBA: !Ref ModoPrueba
          TELEFONO_PRUEBA: !Ref TelefonoPrueba
          CORREOS_PRUEBA: !Ref CorreosPrueba
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_DOMAIN: !Ref CognitoDomain
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          ICP_PATH: /tmp/icp.json
  UrlFuncion:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Funcion
      AuthType: NONE
      InvokeMode: BUFFERED
  # Desde octubre de 2025 una Function URL pública necesita dos permisos: InvokeFunctionUrl e InvokeFunction
  # (este último limitado a llamadas que entran por la URL); con uno solo responde 403.
  PermisoUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  PermisoInvocarPorUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # --- Cron: EventBridge llama a la Function URL por HTTPS (API destinations) ---
  ConexionCron:
    Type: AWS::Events::Connection
    Properties:
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters: {ApiKeyName: x-cron-key, ApiKeyValue: !Ref CronKey}
  DestinoLote:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn: !GetAtt ConexionCron.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "${UrlFuncion.FunctionUrl}cron/lote"
      InvocationRateLimitPerSecond: 1
  DestinoSync:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn: !GetAtt ConexionCron.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "${UrlFuncion.FunctionUrl}cron/sincronizar"
      InvocationRateLimitPerSecond: 1
  CronRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: events.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: invocar-destinos
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{Effect: Allow, Action: events:InvokeApiDestination, Resource: [!GetAtt DestinoLote.Arn, !GetAtt DestinoSync.Arn]}]
  ReglaLote:
    Type: AWS::Events::Rule
    Properties:
      Description: Siguiente lote cada hora, lunes a viernes 7 a 18 y sabados 8 a 14 (hora de Bogota = UTC-5). La app vuelve a validar la ventana.
      ScheduleExpression: cron(5 12-23 ? * MON-FRI *)
      State: !Ref CronLotes
      Targets: [{Id: lote, Arn: !GetAtt DestinoLote.Arn, RoleArn: !GetAtt CronRole.Arn}]
  ReglaLoteSabado:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: cron(5 13-19 ? * SAT *)
      State: !Ref CronLotes
      Targets: [{Id: lote, Arn: !GetAtt DestinoLote.Arn, RoleArn: !GetAtt CronRole.Arn}]
  ReglaSync:
    Type: AWS::Events::Rule
    Properties:
      Description: Lee llamadas de Dapta y pasa al calificador a los que respondieron cada 15 minutos.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets: [{Id: sync, Arn: !GetAtt DestinoSync.Arn, RoleArn: !GetAtt CronRole.Arn}]

Outputs:
  Url:
    Value: !GetAtt UrlFuncion.FunctionUrl
  BaseDeDatos:
    Value: !GetAtt Db.Endpoint.Address
  Bucket:
    Value: !Ref Exportaciones
  Funcion:
    Value: !Ref Funcion
